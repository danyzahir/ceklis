<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Ceklis Kegiatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">Ceklis Kegiatan</h1>
      
      <!-- Progress Bar -->
      <div class="progress-capsule">
        <div class="progress-info">
          <span id="progress-status">0 dari 0 tugas selesai</span>
          <span id="progress-percent" class="percent-badge">0%</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- Input Form Section -->
    <section class="input-section">
      <form id="todo-form" class="todo-form">
        <div class="input-capsule">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Tulis kegiatan baru..." 
            autocomplete="off"
            required
          />
          <button type="submit" class="add-button" id="add-btn" aria-label="Tambah Kegiatan">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span class="btn-text">Tambah</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Filter & Controls Toolbar -->
    <div class="toolbar">
      <div class="filter-group">
        <button type="button" class="filter-pill active" data-filter="all">Semua (<span id="count-all">0</span>)</button>
        <button type="button" class="filter-pill" data-filter="active">Aktif (<span id="count-active">0</span>)</button>
        <button type="button" class="filter-pill" data-filter="completed">Selesai (<span id="count-completed">0</span>)</button>
      </div>

      <div class="actions-group">
        <button type="button" id="clear-completed-btn" class="tool-btn" title="Hapus semua tugas yang sudah selesai">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Hapus Selesai</span>
        </button>
      </div>
    </div>

    <!-- Todo List Items Container (Pill Stack) -->
    <main class="list-wrapper">
      <div id="todo-list" class="todo-list-stack">
        <!-- Dynamic Todo Pill Cards -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon-capsule">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <h3>Belum Ada Kegiatan</h3>
        <p>Tulis kegiatan di atas untuk memulai</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
